# The gateway: stands in for the GKE Gateway (gke-l7-rilb) and its internal ALB.
# Envoy is the data plane Google's Application Load Balancers are built on, so the
# header treatment below is the real one:
#   * TLS terminated here with the bench's internal CA certificate;
#   * plain HTTP to both backends;
#   * x-forwarded-proto set, client IP appended to x-forwarded-for;
#   * the client's Host forwarded UNCHANGED and x-forwarded-host never set.
# Routing is by hostname, so one gateway fronts both the app and the IdP, each
# with its own public name on the same certificate (two SANs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: tfu
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: https
          address:
            socket_address: { address: 0.0.0.0, port_value: 8443 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: gateway
                    use_remote_address: true
                    route_config:
                      name: default
                      virtual_hosts:
                        - name: app
                          domains: ["app.localtest.me"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: app, timeout: 60s }
                        - name: idp
                          domains: ["idp.localtest.me"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: keycloak, timeout: 60s }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain: { filename: /etc/gateway/certs/tls.crt }
                        private_key: { filename: /etc/gateway/certs/tls.key }
      clusters:
        - name: app
          type: STRICT_DNS
          connect_timeout: 5s
          load_assignment:
            cluster_name: app
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: teamfollowup-app.tfu.svc.cluster.local, port_value: 80 }
        - name: keycloak
          type: STRICT_DNS
          connect_timeout: 5s
          load_assignment:
            cluster_name: keycloak
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: keycloak.tfu.svc.cluster.local, port_value: 80 }
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tfu
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/gateway/envoy.yaml", "--log-level", "warn"]
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: config
              mountPath: /etc/gateway/envoy.yaml
              subPath: envoy.yaml
              readOnly: true
            - name: certs
              mountPath: /etc/gateway/certs
              readOnly: true
          readinessProbe:
            tcpSocket: { port: 8443 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
      volumes:
        - name: config
          configMap: { name: gateway-config }
        - name: certs
          secret: { secretName: gateway-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: tfu
spec:
  type: ClusterIP
  # Fixed address so the app pod's hostAliases can point the two public hostnames
  # at the gateway, reproducing split-horizon DNS.
  clusterIP: 10.96.200.200
  selector: { app: gateway }
  ports:
    - name: https
      port: 443
      targetPort: 8443
