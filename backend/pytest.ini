[pytest]
pythonpath = .
testpaths = tests
addopts = -q

# Coverage is NOT in addopts on purpose: measuring costs ~30% on every local run,
# and the number only matters in CI. Run it explicitly:
#   python -m pytest --cov=app --cov-report=term-missing
# The floor enforced by CI lives in .coveragerc, next to the exclusions.
